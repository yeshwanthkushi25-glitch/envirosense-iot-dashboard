AWSTemplateFormatVersion: '2010-09-09'
Description: EnviroSense IoT Climate & Environmental Dashboard - Pure CloudFormation Stack for AWS Learner Lab

Parameters:
  UseLabRole:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to 'true' when deploying in AWS Learner Lab (attaches existing LabRole).

  StageName:
    Type: String
    Default: '$default'
    Description: API Gateway deployment stage name.

Conditions:
  IsInLearnerLab: !Equals [!Ref UseLabRole, 'true']
  CreateCustomRole: !Equals [!Ref UseLabRole, 'false']

Resources:
  # 1. DynamoDB Table
  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-telemetry'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: EnviroSense
        - Key: Course
          Value: 25CAI102PC205

  # 2. IAM Role (Conditional: Only created if NOT in Learner Lab)
  CustomLambdaRole:
    Type: AWS::IAM::Role
    Condition: CreateCustomRole
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt TelemetryTable.Arn

  # 3. AWS Lambda Function
  TelemetryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-handler'
      Runtime: python3.12
      Handler: index.handler
      Code:
        ZipFile: |
          import json, os, time, boto3
          from decimal import Decimal
          table = boto3.resource('dynamodb').Table(os.environ.get('TABLE_NAME', 'envirosense-telemetry'))
          def decimal_default(obj):
              if isinstance(obj, Decimal):
                  return float(obj)
              raise TypeError
          def compute_hi(t, rh):
              if t <= 20.0:
                  return round(t, 2)
              tf = (t * 9.0 / 5.0) + 32.0
              rh_c = max(0.0, min(100.0, rh))
              hi_simple = 0.5 * (tf + 61.0 + ((tf - 68.0) * 1.2) + (rh_c * 0.094))
              if (hi_simple + tf) / 2.0 < 80.0:
                  hi_f = hi_simple
              else:
                  hi_f = -42.379 + 2.04901523*tf + 10.14333127*rh_c - 0.22475541*tf*rh_c - 0.00683783*(tf**2) - 0.05481717*(rh_c**2) + 0.00122874*(tf**2)*rh_c + 0.00085282*tf*(rh_c**2) - 0.00000199*(tf**2)*(rh_c**2)
                  if rh_c < 13.0 and 80.0 <= tf <= 112.0:
                      hi_f -= ((13.0 - rh_c) / 4.0) * (((17.0 - abs(tf - 95.0)) / 17.0) ** 0.5)
                  elif rh_c > 85.0 and 80.0 <= tf <= 87.0:
                      hi_f += ((rh_c - 85.0) / 10.0) * ((87.0 - tf) / 5.0)
              return round((hi_f - 32.0) * 5.0 / 9.0, 2)
          def compute_aqi(gas):
              g = max(0.0, float(gas))
              breaks = [(0.0, 200.0, 0, 50), (201.0, 350.0, 51, 100), (351.0, 500.0, 101, 150), (501.0, 600.0, 151, 200), (601.0, 700.0, 201, 300), (701.0, 1000.0, 301, 500)]
              aqi = 500
              for c_low, c_high, i_low, i_high in breaks:
                  if g <= c_high:
                      aqi = round(((i_high - i_low) / (c_high - c_low)) * (g - c_low) + i_low)
                      break
              aqi = max(0, min(500, aqi))
              if aqi <= 50: cat = "GOOD"
              elif aqi <= 100: cat = "MODERATE"
              elif aqi <= 150: cat = "UNHEALTHY (USG)"
              elif aqi <= 200: cat = "UNHEALTHY"
              elif aqi <= 300: cat = "VERY UNHEALTHY"
              else: cat = "HAZARDOUS"
              return aqi, cat
          def eval_status(t, rh, hi, gas):
              if gas >= 600.0:
                  return 'GAS_ALERT', f'Hazardous gas detected: {gas:.0f} PPM'
              if t <= 5.0:
                  return 'FREEZE_ALERT', f'Low temp: {t}\u00b0C'
              if t >= 40.0 or hi >= 40.0:
                  return 'HEAT_ALERT', f'Heat danger: {hi}\u00b0C'
              if t >= 35.0:
                  return 'WARNING', f'Elevated temp: {t}\u00b0C'
              if rh >= 80.0:
                  return 'HIGH_HUMIDITY', f'High humidity: {rh}%'
              if gas >= 350.0:
                  return 'WARNING', f'Elevated VOC/smoke: {gas:.0f} PPM'
              return 'NORMAL', 'Climate parameters within optimal ranges'
          def handler(event, context):
              method = (event.get('requestContext', {}).get('http', {}).get('method') or event.get('httpMethod', '')).upper()
              headers = {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'content-type,x-api-key', 'Access-Control-Allow-Methods': 'GET,POST,OPTIONS'}
              if method == 'OPTIONS':
                  return {'statusCode': 204, 'headers': headers, 'body': ''}
              if method == 'POST':
                  try:
                      body = json.loads(event.get('body') or '{}')
                      temp = round(float(body.get('temperatureC', 24.5)), 2)
                      hum = round(float(body.get('humidityPct', 50.0)), 2)
                      hi = round(float(body.get('heatIndexC', compute_hi(temp, hum))), 2)
                      gas = round(float(body.get('gasPpm', 150.0)), 1)
                      gas_raw = int(body.get('gasRaw', int(gas * 4.095)))
                      calc_aqi, calc_cat = compute_aqi(gas)
                      aqi = int(body.get('aqi', calc_aqi))
                      aq = str(body.get('airQuality', '')).strip() or calc_cat
                      status, status_detail = eval_status(temp, hum, hi, gas)
                      now = int(time.time())
                      item = {
                          'deviceId': str(body.get('deviceId', 'enviro-node-01')),
                          'recordedAt': body.get('recordedAt', time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())),
                          'location': str(body.get('location', 'Campus Greenhouse Lab')),
                          'temperatureC': Decimal(str(temp)),
                          'humidityPct': Decimal(str(hum)),
                          'heatIndexC': Decimal(str(hi)),
                          'gasPpm': Decimal(str(gas)),
                          'gasRaw': gas_raw,
                          'aqi': aqi,
                          'airQuality': aq,
                          'status': status,
                          'statusDetail': status_detail,
                          'updatedAt': now,
                          'expiresAt': now + int(os.environ.get('TELEMETRY_TTL_SECONDS', '86400'))
                      }
                          'expiresAt': now + int(os.environ.get('TELEMETRY_TTL_SECONDS', '86400'))
                      }
                      table.put_item(Item=item)
                      return {'statusCode': 201, 'headers': headers, 'body': json.dumps({'message': 'Telemetry recorded', 'telemetry': item}, default=decimal_default)}
                  except Exception as e:
                      return {'statusCode': 400, 'headers': headers, 'body': json.dumps({'error': str(e)})}
              if method == 'GET':
                  res = table.scan()
                  items = sorted(res.get('Items', []), key=lambda x: x.get('updatedAt', 0), reverse=True)
                  return {'statusCode': 200, 'headers': headers, 'body': json.dumps({'count': len(items), 'latest': items[0] if items else None, 'telemetry': items[:30]}, default=decimal_default)}
              return {'statusCode': 405, 'headers': headers, 'body': json.dumps({'error': 'Method not allowed'})}
      MemorySize: 128
      Timeout: 10
      Role: !If
        - IsInLearnerLab
        - !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
        - !GetAtt CustomLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
          TELEMETRY_TTL_SECONDS: '86400'

  # 4. Amazon API Gateway HTTP API (v2)
  TelemetryApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  # 5. API Gateway Integration
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TelemetryApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TelemetryFunction.Arn
      PayloadFormatVersion: '2.0'

  # 6. API Routes
  PostTelemetryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TelemetryApi
      RouteKey: 'POST /telemetry'
      Target: !Sub 'integrations/${LambdaIntegration}'

  GetTelemetryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TelemetryApi
      RouteKey: 'GET /telemetry'
      Target: !Sub 'integrations/${LambdaIntegration}'

  OptionsTelemetryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TelemetryApi
      RouteKey: 'OPTIONS /telemetry'
      Target: !Sub 'integrations/${LambdaIntegration}'

  # 7. API Gateway Stage
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TelemetryApi
      StageName: !Ref StageName
      AutoDeploy: true

  # 8. Lambda Permission for API Gateway
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TelemetryFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TelemetryApi}/*/*'

  # 9. Amazon S3 Bucket for Static Website
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-dashboard-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # 10. S3 Bucket Policy for Public Read
  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${DashboardBucket.Arn}/*'

Outputs:
  EnviroApiUrl:
    Description: Base HTTP API Gateway URL for ingestion and dashboard
    Value: !Sub 'https://${TelemetryApi}.execute-api.${AWS::Region}.amazonaws.com'

  DashboardBucketName:
    Description: S3 bucket name storing the dashboard frontend
    Value: !Ref DashboardBucket

  DashboardWebsiteUrl:
    Description: Live public S3 website URL
    Value: !GetAtt DashboardBucket.WebsiteURL
